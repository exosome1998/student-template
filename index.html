{% extends "layout.html" %}

{% block title %}Login - Student Portal{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 0 auto;">
    <h2 style="text-align: center; margin-bottom: 30px; color: #667eea;">Student Login</h2>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/">
        <div class="form-group">
            <label for="student_id">Student ID</label>
            <input type="text" id="student_id" name="student_id" placeholder="e.g., S12345" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn" style="width: 100%;">Log In</button>
    </form>

    <div style="margin-top: 30px; padding: 20px; background: #f9f9f9; border-radius: 5px;">
        <h4 style="margin-bottom: 10px;">Test Accounts:</h4>
        <p style="font-size: 14px; color: #666;">
            <strong>Student ID:</strong> S12345<br>
            <strong>Password:</strong> password123
        </p>
        <p style="font-size: 14px; color: #666; margin-top: 10px;">
            <strong>Student ID:</strong> S12346<br>
            <strong>Password:</strong> qwerty
        </p>
    </div>
</div>
{% endblock %}
